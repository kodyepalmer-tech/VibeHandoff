<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launch · VibeHandoff</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#1b1713"/>
          <path d="M8 23c5-11 15-11 20 0" fill="none" stroke="#f4ead8" stroke-width="2.4"/>
          <circle cx="18" cy="13" r="3.2" fill="#d96b2b"/>
        </svg>
        <span class="brand-copy"><strong data-product>VibeHandoff</strong><span data-tagline>Internal studio</span></span>
      </a>
      <nav>
        <a href="/" data-nav="market">Marketplace</a>
        <a id="back" href="/">Back to app</a>
        <span class="who" id="who"></span>
        <button class="ghost" type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main>
      <p class="meta" id="caption">Resolving an immutable release…</p>
      <p class="meta" id="room-line" hidden>Live room <strong class="room-code" id="room-code"></strong> · <span id="roster"></span></p>
      <iframe class="player" id="frame" title="Launched application" sandbox="allow-scripts allow-forms allow-pointer-lock" referrerpolicy="no-referrer"></iframe>
    </main>
    <script src="/app-shell.js"></script>
    <script src="/launch.js"></script>
  </body>
</html>
