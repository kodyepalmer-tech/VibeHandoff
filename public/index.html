<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeHandoff · Marketplace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#1b1713"/>
          <path d="M8 23c5-11 15-11 20 0" fill="none" stroke="#f4ead8" stroke-width="2.4"/>
          <circle cx="18" cy="13" r="3.2" fill="#d96b2b"/>
        </svg>
        <span class="brand-copy"><strong>VibeHandoff</strong><span>Internal studio</span></span>
      </a>
      <nav>
        <a href="/" data-nav="market" class="active">Marketplace</a>
        <a href="/studio" data-nav="studio">Studio</a>
        <span class="who" id="who"></span>
        <button class="ghost" type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Build something. Hand it off.</p>
          <h1>Where the company’s experiments come to play.</h1>
          <p class="lede">A private shelf for static games, tools, and shared experiences. Discover a release, launch it in a sandboxed frame, and keep the portal itself out of the app’s reach.</p>
        </div>
        <div class="metrics" id="metrics"></div>
      </section>
      <div class="toolbar">
        <input class="search" id="q" placeholder="Search apps, tools, games…" />
        <select id="tag"><option value="">All tags</option></select>
      </div>
      <section class="grid" id="apps"></section>
    </main>
    <script src="/app-shell.js"></script>
    <script src="/marketplace.js"></script>
  </body>
</html>
