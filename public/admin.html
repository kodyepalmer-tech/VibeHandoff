<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · VibeHandoff</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#1b1713"/>
          <path d="M8 23c5-11 15-11 20 0" fill="none" stroke="#f4ead8" stroke-width="2.4"/>
          <circle cx="18" cy="13" r="3.2" fill="#d96b2b"/>
        </svg>
        <span class="brand-copy"><strong>VibeHandoff</strong><span>Internal studio</span></span>
      </a>
      <nav>
        <a href="/" data-nav="market">Marketplace</a>
        <a href="/studio" data-nav="studio">Studio</a>
        <a href="/admin" data-nav="admin">Admin</a>
        <span class="who" id="who"></span>
        <button class="ghost" type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main class="stack">
      <section>
        <p class="eyebrow">Organization</p>
        <h1>Operator desk</h1>
        <p class="lede">Read the audit log, change who can publish, and pull a published app without waiting on its creator.</p>
        <p class="error" id="error" hidden></p>
      </section>
      <section class="panel stack">
        <h2>People</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </section>
      <section class="panel stack">
        <h2>Published apps</h2>
        <table>
          <thead>
            <tr><th>App</th><th>Creator</th><th>Live version</th><th></th></tr>
          </thead>
          <tbody id="apps"></tbody>
        </table>
      </section>
      <section class="panel stack">
        <h2>Audit log</h2>
        <table>
          <thead>
            <tr><th>When</th><th>Who</th><th>Action</th><th>Resource</th></tr>
          </thead>
          <tbody id="audit"></tbody>
        </table>
      </section>
    </main>
    <script src="/app-shell.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
