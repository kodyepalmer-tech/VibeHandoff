<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio · VibeHandoff</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#1b1713"/>
          <path d="M8 23c5-11 15-11 20 0" fill="none" stroke="#f4ead8" stroke-width="2.4"/>
          <circle cx="18" cy="13" r="3.2" fill="#d96b2b"/>
        </svg>
        <span class="brand-copy"><strong>VibeHandoff</strong><span>Internal studio</span></span>
      </a>
      <nav>
        <a href="/" data-nav="market">Marketplace</a>
        <a href="/studio" data-nav="studio">Studio</a>
        <a href="/admin" data-nav="admin" hidden>Admin</a>
        <span class="who" id="who"></span>
        <button class="ghost" type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main class="split">
      <section class="panel stack">
        <h1>Creator studio</h1>
        <p class="meta">Upload a static ZIP. VibeHandoff quarantines it, validates the static-only policy, then lets you promote a version to immutable storage.</p>
        <form id="create" class="stack">
          <input name="name" placeholder="App name" required />
          <input name="slug" placeholder="slug-optional" />
          <input name="tags" placeholder="tags, comma separated" />
          <textarea name="description" placeholder="What should people do with it?"></textarea>
          <button type="submit">Create app</button>
        </form>
        <p class="error" id="create-error" hidden></p>
      </section>
      <section class="panel stack" id="owned"></section>
    </main>
    <script src="/app-shell.js"></script>
    <script src="/studio.js"></script>
  </body>
</html>
