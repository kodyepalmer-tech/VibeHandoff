<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio · Vibe Handoff Enterprise</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#1b1713"/>
          <path d="M8 23c5-11 15-11 20 0" fill="none" stroke="#f4ead8" stroke-width="2.4"/>
          <circle cx="18" cy="13" r="3.2" fill="#d96b2b"/>
        </svg>
        <span class="brand-copy"><strong data-product>Vibe Handoff Enterprise</strong><span data-tagline>Internal studio</span></span>
      </a>
      <nav>
        <a href="/" data-nav="market">Marketplace</a>
        <a href="/studio" data-nav="studio">Studio</a>
        <a href="/admin" data-nav="admin" hidden>Admin</a>
        <span class="who" id="who"></span>
        <button class="ghost" type="button" id="logout">Sign out</button>
      </nav>
    </header>
    <main class="split">
      <section class="panel stack">
        <h1 id="studio-title">Share an app</h1>
        <p class="meta" id="studio-lede">A shortcut, an internal tool, or a small app. Zip the static files with index.html at the root, then publish it for the organization.</p>
        <form id="create" class="stack">
          <input name="name" id="field-name" placeholder="Name" required />
          <input name="slug" placeholder="slug-optional" />
          <div id="kind-row" class="play-actions"></div>
          <input name="tags" id="field-tags" placeholder="shortcut, tool, app" />
          <textarea name="description" id="field-description" placeholder="What does this help someone do?"></textarea>
          <label class="check" id="multiplayer-label"><input type="checkbox" name="multiplayer" /> People in the organization can open this together</label>
          <button type="submit" id="create-submit">Create</button>
        </form>
        <p class="error" id="create-error" hidden></p>
      </section>
      <section class="panel stack" id="owned"></section>
    </main>
    <script src="/app-shell.js"></script>
    <script src="/studio.js"></script>
  </body>
</html>
