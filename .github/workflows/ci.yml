name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibehandoff
          POSTGRES_PASSWORD: vibehandoff
          POSTGRES_DB: vibehandoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibehandoff -d vibehandoff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      AUTH_ADAPTER: dev
      TEST_DATABASE_URL: postgres://vibehandoff:vibehandoff@localhost:5432/vibehandoff_test
      DATABASE_URL: postgres://vibehandoff:vibehandoff@localhost:5432/vibehandoff_test
      SESSION_SECRET: ci-session-secret
      PORTAL_ORIGIN: http://127.0.0.1:13000
      ARTIFACT_HOST_ORIGIN: http://127.0.0.1:13001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run syntax
      - run: npm test
      - run: npm run audit
