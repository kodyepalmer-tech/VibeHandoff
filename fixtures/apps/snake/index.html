<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snake</title>
    <style>
      html, body { margin: 0; height: 100%; background: #120d0a; color: #f4ead8; font-family: Georgia, serif; }
      body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; }
      header, footer { padding: 12px 16px; display: flex; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font-size: 1.3rem; }
      p { margin: 0; opacity: 0.85; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>Snake</h1>
      <p id="score">Score 0</p>
    </header>
    <canvas id="board"></canvas>
    <footer>
      <p id="status">Solo</p>
      <p>Arrows or WASD</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
