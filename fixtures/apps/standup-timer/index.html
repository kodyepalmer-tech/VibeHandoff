<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Standup Timer</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d3b30; color: #f4ead8; font-family: sans-serif; }
      button { font: inherit; padding: 10px 16px; border-radius: 999px; border: 0; cursor: pointer; }
      h1 { font-size: 5rem; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="clock">15:00</h1>
      <button id="go">Start standup</button>
    </main>
    <script>
      let left = 15 * 60;
      let timer;
      const clock = document.getElementById('clock');
      document.getElementById('go').onclick = () => {
        clearInterval(timer);
        timer = setInterval(() => {
          left = Math.max(0, left - 1);
          const m = String(Math.floor(left / 60)).padStart(2, '0');
          const s = String(left % 60).padStart(2, '0');
          clock.textContent = m + ':' + s;
        }, 1000);
      };
    </script>
  </body>
</html>
